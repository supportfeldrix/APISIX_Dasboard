---
# =========================================================
# ConfigMap: appd-prometheus-config  (prod)
# =========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: appd-prometheus-config
  namespace: cro-apisix-prod
data:
  prometheus-config.yaml: |
    prometheus:
      scrape_interval: 15s
      scrape_timeout: 10s
      enabled: true
    exporters:
      - name: apisix
        url: http://apisix-0.apisix.cro-apisix-prod.svc.cluster.local:9091
        metrics_path: /apisix/prometheus/metrics
        labels:
          application: CRO-APISIX-prod
          tier: APISIX-Gateway
---
