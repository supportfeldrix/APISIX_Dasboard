      <account-access-key>adde6ec3-dc86-4dce-89d9-19e86ab8f78a</account-access-key>
      <application-name>CRO-APISIX-prod</application-name>
      <tier-name>APISIX-Gateway</tier-name>
      <node-name>apisix-prod-01</node-name>
