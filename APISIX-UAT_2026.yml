# ==================================
# StatefulSet: etcd (UAT)  — as provided
# ==================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd-uat
  namespace: cro-apisix-uat
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/created-by: username
    app.kubernetes.io/instance: apisix-etcd-uat
    app.kubernetes.io/managed-by: lumos-team
    app.kubernetes.io/name: apisix-etcd
    app.kubernetes.io/part-of: apisix
    app.kubernetes.io/version: v3.5.23
spec:
  serviceName: apisix-etcd
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: apisix-etcd
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
        storageClassName: dorado-nfs-csi
        volumeMode: Filesystem
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      containers:
        - name: apisix-etcd
          image: quay.io/coreos/etcd:v3.5.23
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - "--logger=zap"
            - "--data-dir=/bitnami/etcd"
          env:
            - { name: TZ,                        value: Africa/Johannesburg }
            - { name: ETCD_ENABLE_V2,            value: "true" }
            - { name: ALLOW_NONE_AUTHENTICATION, value: "yes" }
            - { name: ETCD_LISTEN_CLIENT_URLS,   value: "http://0.0.0.0:2379" }
            - { name: ETCD_ADVERTISE_CLIENT_URLS,value: "http://apisix-etcd.cro-apisix-uat.svc.cluster.local:2379" }
          ports:
            - { name: listen, containerPort: 2379, protocol: TCP }
          resources:
            requests: { cpu: 10m,  memory: 200Mi }
            limits:   { memory: 200Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: etcd-data, mountPath: /bitnami/etcd }
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      schedulerName: default-scheduler
---
# =============================
# Service: etcd client (UAT)
# =============================
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: cro-apisix-uat
  labels:
    app: apisix-etcd
    app.kubernetes.io/component: apisix-etcd
    app.kubernetes.io/instance: apisix-etcd
spec:
  type: ClusterIP
  selector:
    app: apisix-etcd
  ports:
    - name: 2379-tcp
      port: 2379
      targetPort: 2379
---
# ==================================
# StatefulSet: apisix (UAT) — canary + probes
# ==================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-uat
  namespace: cro-apisix-uat
spec:
  # 2-replica HA StatefulSet (pod-0, pod-1). Must be explicit — a bare `oc apply`
  # without this defaults to 1 and deletes pod-1, collapsing HA.
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  serviceName: apisix
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  # Keep your canary behavior
  # 3.18.0 rollout COMPLETE (1 Sep 2026): both pods on 3.18.0-redhat, partition reset to 0.
  # For a future canary upgrade: set partition=1, roll pod-1, validate, then set 0.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

  volumeClaimTemplates:
    - metadata: { name: apisix-logs }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
        storageClassName: dorado-nfs-csi
        volumeMode: Filesystem

  template:
    metadata:
      labels:
        app: apisix
    spec:
      securityContext:
        fsGroup: 1000930000
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: Always

      initContainers:
        # Init #0: wait for etcd to be ready
        - name: wait-for-etcd
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo 'Waiting for etcd to be ready...'
              until wget -q -O- http://apisix-etcd.cro-apisix-uat.svc.cluster.local:2379/health 2>/dev/null | grep -q 'true'; do
                echo "etcd not ready yet, waiting..."
                sleep 2
              done
              echo 'etcd is ready!'
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

        # Init #1: wait for config
        - name: wait-for-config
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","echo 'Waiting for /bootstrap/config.yaml...'; while [ ! -s /bootstrap/config.yaml ]; do sleep 1; done"]
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: apisix-config, mountPath: /bootstrap, readOnly: true }

        # Init #2: copy + substitute placeholders with Secret values (FIXED)
        - name: bootstrap-config
          image: registry.access.redhat.com/ubi8/ubi-minimal
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              # Create conf directory if it doesn't exist
              mkdir -p /usr/local/apisix/conf
              # Escape & / for safe sed replacement
              ADMIN_ESC=$(printf '%s' "${ADMIN_KEY}"  | sed -e 's/[\/&]/\\&/g')
              VIEWER_ESC=$(printf '%s' "${VIEWER_KEY}" | sed -e 's/[\/&]/\\&/g')
              sed -e "s#\${ADMIN_KEY}#${ADMIN_ESC}#g" \
                  -e "s#\${VIEWER_KEY}#${VIEWER_ESC}#g" \
                  /bootstrap/config.yaml > /usr/local/apisix/conf/config.yaml
              chmod 0644 /usr/local/apisix/conf/config.yaml
          env:
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: apisix-admin-keys, key: ADMIN_KEY }
            - name: VIEWER_KEY
              valueFrom:
                secretKeyRef: { name: apisix-admin-keys, key: VIEWER_KEY }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: apisix-config, mountPath: /bootstrap, readOnly: true }
            - { name: apisix-conf-emptydir, mountPath: /usr/local/apisix/conf }

      containers:
        - name: apisix
          image: apache/apisix:3.18.0-redhat
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            limits:   { cpu: "500m", memory: 8Gi }
            requests: { cpu: 500m, memory: 6Gi }
          env:
            - { name: TZ, value: Africa/Johannesburg }
            - { name: APISIX_DEPLOYMENT_ETCD_HOST, value: '["http://apisix-etcd.cro-apisix-uat.svc.cluster.local:2379"]' }
            - name: ACTIMIZE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: apisix-oidc-secrets, key: ACTIMIZE_CLIENT_SECRET }

          ports:
            - { name: http,       containerPort: 9080 }
            - { name: admin,      containerPort: 9180 }  
            - { name: control,    containerPort: 9092 }
            - { name: prometheus, containerPort: 9091 }

          # Probes use the control API (9092) — avoids 403/404 on admin/proxy ports during bring-up.
          startupProbe:
            httpGet:
              path: /v1/healthcheck
              port: 9092
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/healthcheck
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/healthcheck
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - { name: apisix-conf-emptydir, mountPath: /usr/local/apisix/conf }
            - { name: apisix-logs, mountPath: /usr/local/apisix/logs }
            - { name: apisix-mime-types, mountPath: /usr/local/apisix/conf/mime.types, subPath: mime.types, readOnly: true }
            - { name: oidc-secret, mountPath: /etc/apisix/secrets, readOnly: true }
            - { name: apisix-temp-emptydir, mountPath: /usr/local/apisix/client_body_temp }
            - { name: apisix-temp-emptydir, mountPath: /usr/local/apisix/proxy_temp }
            - { name: apisix-temp-emptydir, mountPath: /usr/local/apisix/fastcgi_temp }
            - { name: apisix-temp-emptydir, mountPath: /usr/local/apisix/uwsgi_temp }
            - { name: apisix-temp-emptydir, mountPath: /usr/local/apisix/scgi_temp }

        # AppDynamics sidecar (unchanged)
        - name: appdynamics-agent
          image: appdynamics/machine-agent:26.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:    { cpu: "500m", memory: "1Gi" }
          env:
            - { name: APPDYNAMICS_CONTROLLER_HOST_NAME, value: "fnb-dev.saas.appdynamics.com" }
            - { name: APPDYNAMICS_CONTROLLER_PORT, value: "443" }
            - { name: APPDYNAMICS_CONTROLLER_SSL_ENABLED, value: "true" }
            - { name: APPDYNAMICS_AGENT_ACCOUNT_NAME, value: "fnb-dev" }
            - name: APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: appd-controller-secret, key: APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY }
            - { name: APPDYNAMICS_AGENT_APPLICATION_NAME, value: "CRO-APISIX-UAT" }
            - { name: APPDYNAMICS_AGENT_TIER_NAME, value: "APISIX-Gateway" }
            - { name: MACHINE_AGENT_PROPERTIES, value: "-Dappdynamics.agent.logs.dir=/tmp/appd-logs" }
            - name: APPDYNAMICS_AGENT_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          volumeMounts:
            - { name: appd-controller-info,   mountPath: /opt/appdynamics/conf/controller-info.xml, subPath: controller-info.xml, readOnly: true }
            - { name: appd-prometheus-config, mountPath: /opt/appdynamics/conf/prometheus, readOnly: true }
            - { name: appd-logs,              mountPath: /tmp/appd-logs }

      volumes:
        - { name: apisix-config,          configMap: { name: apisix-config } }
        - { name: apisix-mime-types,      configMap: { name: apisix-mime-types } }
        - { name: appd-controller-info,   configMap: { name: appd-controller-info } }
        - { name: appd-prometheus-config, configMap: { name: appd-prometheus-config } }
        - { name: oidc-secret,            secret: { secretName: apisix-oidc-secrets } }
        - { name: appd-logs,              emptyDir: {} }
        - { name: apisix-conf-emptydir,   emptyDir: {} }
        - { name: apisix-temp-emptydir,   emptyDir: {} }
---
# ===============================
# Service: apisix (UAT)
# ===============================
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: cro-apisix-uat
  labels:
    app: apisix
    app.kubernetes.io/component: apisix
    app.kubernetes.io/instance: apisix
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
